# Single-node Aerospike Server config for the DX demo appliance.
#
# Networking note (read before touching addresses): this node is reached two
# ways — from `backend`, over the docker-compose network by service name
# ("aerospike:3000"), and from the host (Voyager, `aql`, browser dev tools)
# via the port docker-compose publishes to localhost. A single access-address
# can't satisfy both, so this mirrors the same access-address /
# alternate-access-address split documented in ../docs/design.md for the
# aerolab/Docker Desktop setup:
#   - default access address  -> auto-detected container address, used by
#     `backend` (same docker network, no extra client config needed).
#   - alternate-access-address -> 127.0.0.1, used by anything connecting from
#     the host. Those clients must opt in (Voyager: "Use services alternate";
#     Java SDK: ClusterDefinition#usingServicesAlternate()) or they'll be
#     handed the container's internal address and fail to reconnect.

service {
	proto-fd-max 15000
	cluster-name aerospike-dx-demo
}

logging {
	console {
		context any info
	}
}

network {
	service {
		address any
		port 3000
		alternate-access-address 127.0.0.1
	}

	heartbeat {
		mode mesh
		address any
		port 3002
		interval 150
		timeout 10
	}

	fabric {
		address any
		port 3001
	}

	info {
		address any
		port 3003
	}
}

namespace demo {
	replication-factor 1
	default-ttl 0s
	nsup-period 0

	storage-engine memory {
		data-size 1G
	}
}
