server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS (127.0.0.11) — resolving `backend` through a
    # variable (below) instead of a bare proxy_pass hostname means nginx
    # re-resolves it at request time rather than once at startup/config-load.
    # Without this, restarting just the `backend` compose service (it can
    # come back with a different container IP) would leave nginx proxying
    # to a stale address until the frontend container itself restarts.
    resolver 127.0.0.11 valid=10s;

    # Reverse-proxy same-origin /api/* calls to the backend container. The
    # trailing slash on proxy_pass strips the /api prefix — a request to
    # /api/search reaches the backend as /search. This mirrors the dev-time
    # Vite proxy rewrite in vite.config.ts. If the real backend turns out to
    # expect the /api prefix itself, drop the trailing slash here (and the
    # matching rewrite in vite.config.ts) — see frontend/README.md.
    location /api/ {
        set $backend_upstream backend:8081;
        # proxy_pass with a variable disables nginx's usual "replace the
        # matched location prefix" behavior (a well-known nginx gotcha), so
        # the /api prefix is stripped explicitly here instead, then
        # proxy_pass (deliberately with no trailing URI of its own) forwards
        # the rewritten path as-is.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: any non-file, non-/api path serves index.html so
    # client-side routes (e.g. /hotels/HTL-4021) survive a hard reload.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets are content-hashed by Vite — safe to cache long-term.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
